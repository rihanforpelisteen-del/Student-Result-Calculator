<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Result Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <h1>Student Result Calculator</h1>
        <p>Enter your details and marks</p>

        <input type="text" id="studentName"
        placeholder="Enter Student Name">

        <h3>Enter Subject Marks</h3>

        <input type="number" id="maths"
        placeholder="Maths Marks">

        <input type="number" id="english"
        placeholder="English Marks">

        <input type="number" id="science"
        placeholder="Science Marks">

        <input type="number" id="computer"
        placeholder="Computer Marks">

        <input type="number" id="hindi"
        placeholder="Hindi Marks">

        <button onclick="calculateResult()">
            Calculate Result
        </button>

        <div id="result"></div>

    </div>

    <script src="script.js"></script>

</body>
</html>
